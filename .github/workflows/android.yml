name: Android — bundle signé

# Se lance À LA MAIN (onglet « Actions » → « Android — bundle signé » → « Run workflow »).
#
# ⚠️ JAMAIS sur un `pull_request` ni un `push` : ce workflow manipule la clé de
# signature de l'application, qu'une branche quelconque ne doit pas pouvoir lire.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version affichée (ex. 1.0, 1.1)"
        required: false
        default: "1.0"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Poser la clé de téléversement
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "::error::Le secret ANDROID_KEYSTORE_BASE64 est vide."; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/televersement.p12"

      - name: Construire et signer le bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/televersement.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: quioffre
          # Le numéro de ce passage : il ne fait que monter, comme Google Play l'exige.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version }}
        run: node scripts/android-construire.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: quioffre-aab
          path: sortie-android/*.aab
          retention-days: 14
          if-no-files-found: error

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/televersement.p12"
